name: Build & deploy docker image

on:
  push:
    branches:
      - fix/**
      - feature/**
      - refactor/**
  pull_request:
    types:
      - closed
    branches:
      - master
jobs:
  build_push:
    name: Build and deploy
#    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: shell2016/telegrambot
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Get project version from Gradle
        id: get_version
        run: echo "VERSION=$(./gradlew -q properties | grep '^version:' | awk '{print $2}')" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker image with version tag
        run: docker build -t $IMAGE_NAME:$VERSION .

      - name: Tag image as latest
        run: docker tag $IMAGE_NAME:$VERSION $IMAGE_NAME:latest

      - name: Push version tag
        run: docker push $IMAGE_NAME:$VERSION

      - name: Push latest tag
        run: docker push $IMAGE_NAME:latest

